<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Room_25 | 開発ログ</title>

<meta property="og:title" content="Room_25 | 開発ログ">

<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&display=swap" rel="stylesheet">
<style>
:root{--bg:#efeee9;--ink:#0b0c0e;--sub:#6b6f75;--acc:#d4ff00}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.6 "Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
 background-image:linear-gradient(rgba(0,0,0,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(0,0,0,.04) 1px,transparent 1px);background-size:24px 24px}
main{max-width:480px;margin:0 auto;padding:36px 20px 44px}
.plate{background:var(--ink);color:#f4f4f2;border-radius:6px;padding:22px 22px 18px;position:relative;box-shadow:6px 6px 0 var(--acc)}
.plate::before,.plate::after{content:"";position:absolute;top:12px;width:7px;height:7px;border-radius:50%;background:#3a3e44}
.plate::before{left:12px}.plate::after{right:12px}
.plate small{font:700 10px/1 ui-monospace,Menlo,monospace;letter-spacing:.3em;color:#8a9098}
.plate b{display:block;font:400 46px/1 "Dela Gothic One",sans-serif;margin:10px 0 8px;letter-spacing:.02em}
.plate b span{color:var(--acc)}
.plate p{font-size:12.5px;color:#a9b0b8}
.knock{margin:30px 0 10px;font:700 11px/1 ui-monospace,Menlo,monospace;letter-spacing:.2em;color:var(--sub)}
/* 記事 */
.post{display:block;background:#fff;border:2px solid var(--ink);border-radius:6px;padding:14px 16px;text-decoration:none;color:var(--ink);box-shadow:4px 4px 0 var(--ink);transition:transform .1s,box-shadow .1s,background .1s;margin-bottom:12px}
.post:hover{background:var(--acc)}
.post:active{transform:translate(4px,4px);box-shadow:none}
.meta{font:700 11px/1.2 ui-monospace,Menlo,monospace;color:var(--sub);display:flex;justify-content:space-between;gap:8px}
.tag{padding:3px 6px;border-radius:3px;white-space:nowrap;font:700 10.5px/1 ui-monospace,Menlo,monospace}
.tag.p{background:var(--ink);color:var(--acc)}
.tag.n{background:var(--acc);color:var(--ink);border:1px solid var(--ink)}
.post b{display:block;font:400 19px/1.3 "Dela Gothic One",sans-serif;margin:8px 0 4px}
.post .d{font-size:12.5px;color:var(--sub)}
.post:hover .d{color:var(--ink)}
.post .read{display:inline-block;margin-top:8px;font:400 12px/1 "Dela Gothic One",sans-serif;background:var(--acc);border:2px solid var(--ink);padding:6px 9px;border-radius:3px}
.post:hover .read{background:#fff}
/* 切り替え */
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;font:400 13px/1 "Dela Gothic One",sans-serif;padding:10px 4px;border:2px solid var(--ink);border-radius:4px;background:#fff;color:var(--ink);cursor:pointer}
.tabs button.on{background:var(--ink);color:var(--acc)}
/* 年表 */
.tl{list-style:none;padding:0;position:relative}
.tl::before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:var(--ink)}
.tl li{position:relative;padding:0 0 16px 28px}
.tl li::before{content:"";position:absolute;left:1px;top:5px;width:10px;height:10px;border:2px solid var(--ink);background:#fff;border-radius:50%}
.tl li.big::before{background:var(--acc)}
.tl .when{font:700 11px/1.2 ui-monospace,Menlo,monospace;color:var(--sub);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tl h3{font:400 15.5px/1.35 "Dela Gothic One",sans-serif;margin:5px 0 3px}
.tl p{font-size:13px;color:#33373c;line-height:1.65}
.tl a{color:var(--ink);font-weight:700}
.hide{display:none!important}
.back{display:block;text-align:center;margin-top:18px;font:700 11px/1 ui-monospace,Menlo,monospace;letter-spacing:.15em;color:var(--sub);text-decoration:none}
footer{margin-top:30px;color:var(--sub);font-size:11px;line-height:1.8;text-align:center}
</style></head><body>
<main>
 <div class="plate"><small>ROOM_25 ／ DEVLOG</small><b>開発<span>ログ</span></b><p>英単語アプリ「どぱたん＋」と、その次の「次世代どぱたん」をつくりながら、試したこと・わかったことを置いていく場所。</p></div>

 <div class="knock">— READ</div>
 <div id="posts"></div>

 <div class="knock">— TIMELINE</div>
 <div class="tabs" id="tabs">
  <button data-f="all" class="on">すべて</button>
  <button data-f="p">どぱたん＋</button>
  <button data-f="n">次世代</button>
 </div>
 <ul class="tl" id="tl"></ul>

 <a class="back" href="../links/">← Room_25 リンク集</a>
 <footer>© Room_25<br>どぱたん＋ 立ち絵：わたおきば ／ 音声：VOICEVOX</footer>
</main>
<script>
/* ===== ここだけ書き換えればOK（新しいものを上に） ===== */
const NAME = {p:"どぱたん＋", n:"次世代"};

// 読み物（記事ページがあるもの）
const POSTS = [
 {no:"02", date:"2026.11.17", pj:"n", title:"1枚の立ち絵を「Live2D風」に動かす",
  desc:"AIで立ち絵をパーツに分けて、ブラウザで動かした。1体あたり素材代＋約150円。AIに読ませる用のガイドつき。", url:"live2d/"},
 {no:"01", date:"2026.11.15–16", pj:"p", title:"iPhoneのホーム画面アプリだけ10秒で落ちる",
  desc:"メモリが毎秒150MB増えて2GBで強制終了。原因は背景でも画像でもなく「音」だった。外れた見立ても全部。", url:"iphone-crash/"},
];

// 年表（big:true で点が光る）
const TIMELINE = [
 {date:"11.17", pj:"n", big:true, title:"立ち絵を「Live2D風」に動かす試作", text:"AIでパーツに分けて、まばたき・口パク・視線・髪の揺れ・ジャンプまで。なめらかに動くほどAIっぽく見えるので、セル塗り＋トーンの見た目に。", url:"live2d/"},
 {date:"11.17", pj:"n", title:"次世代どぱたんの構想", text:"英単語に加えて、文法・読解・リスニング・発音まで。コミック調の画面のイメージを5枚つくった。"},
 {date:"11.17", pj:"p", title:"v2.04〜v2.06 フィードバック50件を反映", text:"テストプレイの意見をまとめて直した。目標のごほうびが2回もらえる、チュートリアルで雰囲気を選べない、など。"},
 {date:"11.17", pj:"p", title:"「CPU 50%」は計測ツールのせいだった", text:"iPhoneで重く見えたのは、Webインスペクタのスクリーンショット記録の負荷。いったん入れた対策は元に戻した。"},
 {date:"11.17", pj:"p", big:true, title:"全5051語の訳語を見直し", text:"訳の誤り18語を修正。3択に「正解と同じ意味の別の単語」が混ざる穴（279組）もふさいだ。これで全単語に例文がある。"},
 {date:"11.16", pj:"p", title:"自動の通しテストを追加", text:"まっさらな状態から「はじめる→学習→テスト→ガチャ→ストーリー→開き直し」まで自動で進めて確かめる。開き直すとストーリーの記録が消える不具合が見つかった。"},
 {date:"11.16", pj:"p", title:"ストーリーを1人3話に作り直し", text:"全39人・117話。絆のレベルで1話ずつ開く。新しい台詞907行にVOICEVOXで声をつけた。"},
 {date:"11.16", pj:"p", big:true, title:"iPhoneで落ちる問題を解決", text:"原因は音の仕組み。最大メモリ2.1GB → 約200MBに。", url:"iphone-crash/"},
 {date:"11.15", pj:"p", title:"「どぱたん」をゲームクリエイター甲子園に提出", text:"どぱたん＋をもとにした提出版をつくった。"},
 {date:"11.15", pj:"p", title:"声を全4,000行作り直し", text:"全39人の速さ・抑揚・高さをキャラごとに調整。読み間違いは辞書と自動で照らし合わせて直した。BGMは「寄り添い」と「ノリノリ」の2つに。"},
 {date:"11.14", pj:"p", big:true, title:"「どぱたん＋」になった", text:"NGSL-GRの2,242語を足して5,051語に。新キャラ19人（全39人）、クラウド保存と全国ランキングも。"},
 {date:"11.12–13", pj:"p", title:"ガチャ演出・ボス戦・ストーリー", text:"ガチャの演出を一新、ボス戦とキャラのカード、ストーリーを追加。全2,809語に例文と英語の音声をつけた。"},
 {date:"11.11", pj:"p", big:true, title:"「どぱたん」初版", text:"NGSLの2,809語・全20ステージ・キャラ20人。ガチャとキャラで覚える英単語アプリとしてスタート。"},
];
/* ======================================================= */
const tag = pj => `<span class="tag ${pj}">${NAME[pj]}</span>`;
document.getElementById("posts").innerHTML = POSTS.map(l=>
 `<a class="post" href="${l.url}"><span class="meta"><span>LOG ${l.no} ／ ${l.date}</span>${tag(l.pj)}</span><b>${l.title}</b><span class="d">${l.desc}</span><br><span class="read">読む →</span></a>`).join("");
document.getElementById("tl").innerHTML = TIMELINE.map(t=>
 `<li class="${t.big?"big":""}" data-pj="${t.pj}"><span class="when">2026.${t.date} ${tag(t.pj)}</span><h3>${t.title}</h3><p>${t.text}${t.url?` <a href="${t.url}">記事を読む →</a>`:""}</p></li>`).join("");
document.getElementById("tabs").addEventListener("click", e=>{
 const f = e.target.dataset.f; if(!f) return;
 document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on", b===e.target));
 document.querySelectorAll("#tl li").forEach(li=>li.classList.toggle("hide", f!=="all" && li.dataset.pj!==f));
});
</script>
<script data-goatcounter="https://room25.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</body></html>
